databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: Fahad
      changes:
        - createTable:
            tableName: USERS
            columns:
              - column:
                  name: ID
                  type: VARCHAR
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(15)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: username
                  type: varchar(20)
                  constraints:
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
              - column:
                  name: registered
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
      rollback:
        - dropTable:
            tableName: USERS