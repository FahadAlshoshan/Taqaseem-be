name: Docker Image CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with maven
        run: mvn clean install --file taqaseem/ -Dspring.profiles.active=local -DskipTests

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: docker build taqaseem/ --tag ${{ secrets.DOCKERHUB_USERNAME }}/taqaseem-be:latest 

      - name: Docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/taqaseem-be:latest
